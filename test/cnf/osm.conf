# OSM engine configuration example
#
# The data is not packaged. Each subdirectory of the data directory is a
# dataset whose PMTiles files share the same tile schema, each *.pmtiles
# file directly in the directory is a dataset of its own:
#
#   /smartmet/data/osm/protomaps/planet.pmtiles      the whole world, zoom 0-15
#   /smartmet/data/osm/protomaps/nordic-z15.pmtiles  optional regional detail
#
# The most detailed file available is used for each tile, so a server can
# be localized with a detailed regional file and a smaller global file.
# Install new files with an atomic rename, never overwrite them in place.
# Of files named like planet-20261017.pmtiles and planet-20261117.pmtiles
# only the newest version is used.

directory = "/smartmet/data/osm";

# MapLibre styles, one per JSON file
styles = "/usr/share/smartmet/osm/styles";

# Seconds between directory rescans, 0 disables
rescan_interval = 60;

# Files modified less than this many seconds ago are not opened yet
min_file_age = 10;

# Memory limits
tile_cache_mb = 512;      # decompressed tiles
decoded_cache_mb = 1024;  # decoded tiles used for rendering
leaf_cache_size = 256;    # decoded leaf directories per file

# How files are read: mmap on local disks and pread on network file systems
# such as NFS (auto), or always "mmap" or "pread"
file_access = "auto";

# Explicitly named datasets in other locations
# datasets:
# {
#   local: { directory = "/data/osm/local"; };
#   test:  { files = ["/data/test/a.pmtiles", "/data/test/b.pmtiles"]; };
# };

# Datasets published in PostgreSQL with smartmet-osm-pgload. Database and
# directory datasets of the same name are combined.
# postgresql:
# {
#   host = "db"; port = 5432; database = "osm";
#   username = "osm"; password = "secret";
#   schema = "osm";
# };
